name: Feature request / 功能建议
description: Suggest a new skill, endpoint or capability / 建议新增技能、接口或能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Type / 类型
      options:
        - New skill / 新增技能
        - New market or data coverage / 新增市场或数据覆盖
        - Improve an existing skill / 改进现有技能
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What can you not do today?
      placeholder: I want to ask about ... but no toolset covers it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Example questions / 示例问题
      description: What would users ask that this should answer?
      placeholder: |
        - ...
        - ...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 其他方案
