name: Bug report / 问题反馈
description: Report a problem with a skill / 反馈技能使用中的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** paste your API key anywhere in this issue.
        感谢反馈。请**不要**在 Issue 中粘贴你的 API Key。

  - type: input
    id: skill
    attributes:
      label: Skill / 技能
      placeholder: fiu-finance-mcp
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client and version / 客户端与版本
      placeholder: Claude Code 2.x / Claude Desktop / Cursor / ...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened / 问题描述
      description: What did you ask, and what came back?
      placeholder: |
        Asked: ...
        Toolset / endpoint: quote_spot / get_quote
        Result: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected / 期望结果
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: A command line reproduction is ideal.
      placeholder: |
        node scripts/call.js call quote_spot --endpoint get_quote --param market=HK --param assetType=stock --param symbols=00700.hk
      render: shell

  - type: textarea
    id: error
    attributes:
      label: Error output / 错误信息
      description: Full error message. Redact the API key.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      placeholder: |
        OS: macOS 15 / Windows 11 / Ubuntu 24.04
        Node: v22.x
        Install method: install.sh / ClawHub / manual copy

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 检查项
      options:
        - label: I ran `./test.sh` and included the result above / 已运行 `./test.sh` 并附上结果
        - label: No API key appears in this issue / 本 Issue 中不含 API Key
          required: true
