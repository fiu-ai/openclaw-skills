name: Question / 使用咨询
description: Ask about installation, configuration or usage / 咨询安装、配置或使用问题
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check [USAGE_EN.md](../../USAGE_EN.md) / [USAGE.md](../../USAGE.md) and the troubleshooting reference.
        提问前请先看 [USAGE.md](../../USAGE.md) 和排障文档。

        Please do **not** paste your API key. / 请**不要**粘贴 API Key。

  - type: dropdown
    id: topic
    attributes:
      label: Topic / 主题
      options:
        - Installation / 安装
        - Authentication / 鉴权
        - Client configuration / 客户端配置
        - Which toolset to use / 工具集选择
        - Data coverage / 数据覆盖范围
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question / 问题
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have tried / 已尝试的操作
      placeholder: |
        ./test.sh result: ...
        Docs checked: ...

  - type: input
    id: client
    attributes:
      label: Client and version / 客户端与版本
      placeholder: Claude Code 2.x / Claude Desktop / Cursor / ...
